name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['5.4.5', '7.0.2']
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select compatibility versions
        run: pnpm add -D --ignore-scripts typescript@${{ matrix.typescript }} react@${{ matrix.react }} react-dom@${{ matrix.react }} @types/react@${{ matrix.react }}
      - run: pnpm test
